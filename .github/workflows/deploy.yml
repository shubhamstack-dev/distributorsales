name: Distributor Sales CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: distributor-sales-production
  cancel-in-progress: false


jobs:

  # ============================================================
  # CI - TEST AND BUILD
  # ============================================================
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # --------------------------------------------------------
      # Backend dependencies
      # --------------------------------------------------------
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest


      # --------------------------------------------------------
      # Backend tests
      # --------------------------------------------------------
      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pytest -q


      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # --------------------------------------------------------
      # Frontend dependencies
      # --------------------------------------------------------
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci


      # --------------------------------------------------------
      # Frontend production build
      # --------------------------------------------------------
      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build


      # --------------------------------------------------------
      # Validate Docker Compose
      # --------------------------------------------------------
      - name: Validate Docker Compose
        run: |
          docker compose config


  # ============================================================
  # CD - PRODUCTION DEPLOYMENT
  # ============================================================
  deploy:
    name: Deploy Production
    needs: test

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      # --------------------------------------------------------
      # Deploy through SSH
      # --------------------------------------------------------
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script_stop: true

          script: |

            set -e

            echo "========================================"
            echo "Distributor Sales Production Deployment"
            echo "========================================"

            cd /opt/distributorsales


            # --------------------------------------------------
            # Pull latest code
            # --------------------------------------------------

            echo "Fetching latest main branch..."

            git fetch origin main

            git reset --hard origin/main


            # --------------------------------------------------
            # Verify branch
            # --------------------------------------------------

            echo "Current commit:"

            git rev-parse --short HEAD


            # --------------------------------------------------
            # Build containers
            # --------------------------------------------------

            echo "Building Docker containers..."

            docker compose build


            # --------------------------------------------------
            # Start containers
            # --------------------------------------------------

            echo "Starting Distributor Sales..."

            docker compose up -d


            # --------------------------------------------------
            # Wait for startup
            # --------------------------------------------------

            echo "Waiting for services..."

            sleep 15


            # --------------------------------------------------
            # Show container status
            # --------------------------------------------------

            echo "Container status:"

            docker compose ps


            # --------------------------------------------------
            # Check web application
            # --------------------------------------------------

            echo "Checking web application..."

            curl -f http://127.0.0.1:8081


            # --------------------------------------------------
            # Cleanup unused images
            # --------------------------------------------------

            echo "Cleaning unused Docker images..."

            docker image prune -f


            echo "========================================"
            echo "Deployment completed successfully"
            echo "========================================"