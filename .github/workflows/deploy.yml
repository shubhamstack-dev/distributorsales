```yaml
name: Distributor Sales CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: distributor-sales-production
  cancel-in-progress: false

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Backend
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pytest -q

      # -----------------------------
      # Frontend
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

      # -----------------------------
      # Docker Compose validation
      # -----------------------------
      - name: Validate Docker Compose
        env:
          MYSQL_PASSWORD: ci-password
          MYSQL_PASSWORD_URLENC: ci-password
          SECRET_KEY: ci-secret-key
          APP_PASSWORD: ci-app-password
          CORS_ORIGINS: http://localhost
          MAX_UPLOAD_MB: 60
        run: |
          docker compose config

  # ==========================================
  # PRODUCTION DEPLOYMENT
  # ==========================================
  deploy:
    name: Deploy Production
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true

          script: |
            set -e

            echo "========================================"
            echo "Distributor Sales Production Deployment"
            echo "========================================"

            cd /opt/distributorsales

            echo ""
            echo "Fetching latest main branch..."
            git fetch origin main

            echo ""
            echo "Resetting server to latest main..."
            git reset --hard origin/main

            echo ""
            echo "Current commit:"
            git rev-parse --short HEAD

            echo ""
            echo "Checking production environment..."
            if [ ! -f .env ]; then
              echo "ERROR: /opt/distributorsales/.env does not exist."
              echo "Create the production .env file on the server first."
              exit 1
            fi

            echo ""
            echo "Building Docker containers..."
            docker compose build

            echo ""
            echo "Starting