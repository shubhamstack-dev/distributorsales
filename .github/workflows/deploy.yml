services:
  mysql:
    image: mysql:8.0
    container_name: ds-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: distributor_sales

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: ds-api
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DATABASE_URL: "mysql+pymysql://root:${MYSQL_PASSWORD_URLENC}@mysql:3306/distributor_sales"
      CORS_ORIGINS: "${CORS_ORIGINS}"
      SECRET_KEY: "${SECRET_KEY}"
      APP_PASSWORD: "${APP_PASSWORD}"
      STAGING_DIR: /app/data/staging
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-60}"

    volumes:
      - staging:/app/data/staging

    expose:
      - "8000"

  web:
    build: ./frontend
    container_name: ds-web
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "127.0.0.1:8081:80"

volumes:
  mysql_data:
  staging: