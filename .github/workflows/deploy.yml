name: Distributor Sales CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: distributor-sales-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true

          script: |
            set -e

            echo "========================================"
            echo " Distributor Sales Production Deployment"
            echo "========================================"

            echo ""
            echo "=== Going to application directory ==="
            cd /opt/distributorsales

            echo ""
            echo "=== Updating source code ==="
            git fetch origin main
            git reset --hard origin/main

            echo ""
            echo "=== Current commit ==="
            git rev-parse --short HEAD

            echo ""
            echo "=== Checking production environment ==="
            if [ ! -f .env ]; then
              echo "ERROR: Production .env file not found."
              exit 1
            fi

            echo ".env exists."

            echo ""
            echo "=== Validating Docker Compose ==="
            docker compose config >/dev/null

            echo "Docker Compose configuration is valid."

            echo ""
            echo "=== Building application images ==="
            docker compose build

            echo ""
            echo "=== Starting application ==="
            docker compose up -d

            echo ""
            echo "=== Waiting for containers to initialize ==="
            sleep 15

            echo ""
            echo "=== Container status ==="
            docker compose ps

            echo ""
            echo "=== Checking MySQL container ==="
            if ! docker compose ps --status running | grep -q "ds-mysql"; then
              echo "ERROR: ds-mysql is not running."
              docker compose logs --tail=100 mysql || true
              exit 1
            fi

            echo "ds-mysql is running."

            echo ""
            echo "=== Checking backend container ==="
            if ! docker compose ps --status running | grep -q "ds-api"; then
              echo "ERROR: ds-api is not running."
              docker compose logs --tail=100 backend || true
              exit 1
            fi

            echo "ds-api is running."

            echo ""
            echo "=== Checking frontend container ==="
            if ! docker compose ps --status running | grep -q "ds-web"; then
              echo "ERROR: ds-web is not running."
              docker compose logs --tail=100 web || true
              exit 1
            fi

            echo "ds-web is running."

            echo ""
            echo "=== Testing frontend locally ==="
            curl --fail --silent --show-error \
              http://127.0.0.1:8081 >/dev/null

            echo "Frontend responded successfully."

            echo ""
            echo "=== Testing backend container ==="
            docker compose exec -T backend \
              python -c "print('Backend container OK')"

            echo ""
            echo "=== Final container status ==="
            docker compose ps

            echo ""
            echo "========================================"
            echo " Deployment completed successfully"
            echo "========================================"

            echo ""
            echo "NOTE:"
            echo "Public HTTPS/subdomain routing still requires"
            echo "Caddy configuration for distributorsales.hosticare.in."